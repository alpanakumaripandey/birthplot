# Deploy from monorepo: set Base directory to `web` in Netlify UI,
# or link this file when the site root is `web`.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
