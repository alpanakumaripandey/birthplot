<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthplot — your Vedic plot twist</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('birthplot_theme') || 'day';
          var m = localStorage.getItem('birthplot_motion') || 'drama';
          var l = localStorage.getItem('birthplot_lingo') || 'funky';
          document.documentElement.setAttribute('data-theme', t === 'ratri' ? 'ratri' : 'day');
          document.documentElement.setAttribute('data-motion', m);
          document.documentElement.setAttribute('data-lingo', l);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
