[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kundli"
version = "0.1.0"
description = "Interactive Vedic (Jyotish) kundli CLI for non-experts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "skyfield>=1.49",
  "geopy>=2.4.1",
  "timezonefinder>=6.5.0",
  "tzdata>=2024.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
kundli = "kundli.cli:app"

[tool.setuptools.packages.find]
include = ["kundli*", "api*"]

[tool.setuptools.package-data]
kundli = ["knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
